<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Cube Simulation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0C0D0D;color:#fff;overflow:hidden;
       font-family:"Noto Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;font-size:12px}
  .room{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        cursor:grab;touch-action:none}
  .room:active{cursor:grabbing}
  .room.over{outline:1px dashed rgba(255,255,255,.45);outline-offset:-12px}
  .stage{display:flex;align-items:center;justify-content:center;gap:0}
  .scene{position:relative;flex:0 0 auto}
  .cube{position:relative;transform-style:preserve-3d;will-change:transform}
  .cf{position:absolute;background:#000;backface-visibility:hidden}
  .pnl{position:absolute;overflow:hidden;background:#000}
  .pnl canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* the plate sits inside every panel it crosses, so a seam cuts it like a picture */
  .plate{position:absolute;color:rgba(0,0,0,.85);line-height:1}
  .plate span{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;display:block}
  .plate .k{font-weight:700}
  .plate .px{font-weight:600}
  .plate .fr{color:#C4161C;font-weight:600}

  .pick{position:fixed;left:22px;top:18px;z-index:6;display:flex;gap:4px}
  .pick button{padding:7px 12px;border:0;border-radius:2px;background:rgba(255,255,255,.1);
                color:#fff;font:600 11px/1 inherit;letter-spacing:.08em;cursor:pointer}
  .pick button:hover{background:rgba(255,255,255,.22)}
  .pick button.on{background:#fff;color:#111}

  .bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
       display:flex;gap:6px;align-items:center;z-index:5}
  .btn{padding:9px 16px;border:0;border-radius:2px;background:#fff;color:#111;
       font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.07em;cursor:pointer}
  .btn:hover{background:#E6E6E6}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.22)}
  .btn.ghost.on{background:#fff;color:#111}
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{width:30px;height:30px;border:0;border-radius:2px;background:rgba(255,255,255,.12);
       color:#fff;font:600 11px/1 inherit;cursor:pointer}
  .tab.on{background:#fff;color:#111}
  .tab:hover{background:rgba(255,255,255,.26)}
  .tab.on:hover{background:#fff}

  #set{position:fixed;right:0;top:0;width:306px;height:100%;background:#131514;
       border-left:1px solid #262928;padding:18px 16px 40px;overflow-y:auto;
       transform:translateX(100%);transition:transform .22s ease;z-index:6}
  #set.on{transform:none}
  #set h4{font-size:10px;letter-spacing:.18em;color:#80857F;font-weight:600;margin:16px 0 8px}
  #set h4:first-child{margin-top:0}
  .lay{border:1px solid #262928;padding:9px;margin-bottom:7px}
  .lay.sel{border-color:#fff}
  .lhead{display:flex;gap:6px;align-items:center;margin-bottom:7px}
  .lhead .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
             font-size:11px;cursor:pointer}
  .ic{width:22px;height:22px;border:0;border-radius:2px;background:rgba(255,255,255,.1);
      color:#fff;font:600 11px/1 inherit;cursor:pointer}
  .ic:hover{background:rgba(255,255,255,.24)}
  .ic.off{opacity:.35}
  .r{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .r label{flex:0 0 74px;color:#80857F;font-size:10px;letter-spacing:.04em}
  .r input[type=range]{flex:1 1 auto;min-width:0;accent-color:#fff;height:14px}
  .r input[type=color]{flex:1 1 auto;min-width:0;height:22px;padding:0;border:1px solid #2C302F;
                       background:#1C1F1E;cursor:pointer}
  .r .v{flex:0 0 44px;text-align:right;font-size:10px;color:#C9CCC8}
  .r select{flex:1 1 auto;min-width:0;background:#1C1F1E;color:#fff;border:1px solid #2C302F;
            font:inherit;font-size:10px;padding:3px 5px}
  .empty{color:#6C716C;font-size:11px;line-height:1.7;padding:6px 0}
</style>
</head>
<body>

<div class="pick" id="pickbar"></div>
<div class="room" id="room"><div class="stage" id="stage"></div></div>

<div class="bar" id="bar">
  <button class="btn" id="add" type="button">IMAGE / VIDEO</button>
  <button class="btn ghost" id="gear" type="button">SETTINGS</button>
  <button class="btn ghost" id="reset" type="button">RESET</button>
  <div class="tabs" id="tabs"></div>
</div>
<aside id="set"></aside>
<input id="pick" type="file" multiple style="display:none"
       accept="image/*,video/*,.mov,.mp4,.m4v,.webm,.mkv,.avi,.qt">

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const room = $("room"), stage = $("stage"), setPanel = $("set");
  const el = (c, s) => { const d = document.createElement("div"); if (c) d.className = c; if (s) d.style.cssText = s; return d; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ----------------------------------------------------------------------
     Each rig is a box W x H x D in its own units, unrolled as left | front |
     right | back with the bottom flap under the front. Reading the net left
     to right runs continuously around the box, so a panel's source rect and
     its face-local position share one direction. Faces butt together: any
     gap belongs inside a face.
     ---------------------------------------------------------------------- */
  const P1 = 2880, SL = 260, F1 = P1 * 2 + SL, LW = 1600, C1 = P1 + SL;   // cube 1, in mm

  const RIGS = {
    "1": {
      name:"CUBE 1", src:[2000, 1440], W:F1, H:F1, D:F1, rel:1,
      note:"2880 mm displays, 260 mm cross · 1 px = 8 mm",
      pieces:{
        A:  { f:"left",   x:F1-LW, y:0,  w:LW,  h:F1, c:"#E4443B", k:"A", px:"200 × 720" },
        B:  { f:"front",  x:0,     y:0,  w:F1,  h:F1, c:"#F0A830", k:"B", px:"720 × 720", front:true },
        C:  { f:"right",  x:0,     y:0,  w:F1,  h:F1, c:"#7B68E8", k:"C", px:"720 × 720" },
        D:  { f:"back",   x:0,     y:0,  w:P1,  h:F1, c:"#4FD8E8", k:"D", px:"360 × 720" },
        E1: { f:"bottom", x:0,     y:0,  w:P1,  h:P1, c:"#C96BE0", k:"E", px:"360 × 360" },
        E2: { f:"bottom", x:C1,    y:0,  w:P1,  h:F1, c:"#E8D83B", k:"E", px:"360 × 720" }
      },
      panels:[
        { p:"B",  x:0,     y:0,  w:P1, h:P1, s:[ 200,   0, 360, 360] },
        { p:"B",  x:C1,    y:0,  w:P1, h:P1, s:[ 560,   0, 360, 360] },
        { p:"B",  x:0,     y:C1, w:P1, h:P1, s:[ 200, 360, 360, 360] },
        { p:"B",  x:C1,    y:C1, w:P1, h:P1, s:[ 560, 360, 360, 360] },
        { p:"C",  x:0,     y:0,  w:P1, h:P1, s:[ 920,   0, 360, 360] },
        { p:"C",  x:C1,    y:0,  w:P1, h:P1, s:[1280,   0, 360, 360] },
        { p:"C",  x:0,     y:C1, w:P1, h:P1, s:[ 920, 360, 360, 360] },
        { p:"C",  x:C1,    y:C1, w:P1, h:P1, s:[1280, 360, 360, 360] },
        { p:"D",  x:0,     y:0,  w:P1, h:P1, s:[1640,   0, 360, 360] },
        { p:"D",  x:0,     y:C1, w:P1, h:P1, s:[1640, 360, 360, 360] },
        { p:"A",  x:F1-LW, y:0,  w:LW, h:P1, s:[   0,   0, 200, 360] },
        { p:"A",  x:F1-LW, y:C1, w:LW, h:P1, s:[   0, 360, 200, 360] },
        { p:"E1", x:0,     y:0,  w:P1, h:P1, s:[ 200, 720, 360, 360] },
        { p:"E2", x:C1,    y:0,  w:P1, h:P1, s:[ 560, 720, 360, 360] },
        { p:"E2", x:C1,    y:C1, w:P1, h:P1, s:[ 560,1080, 360, 360] }
      ]
    },

    "2": {
      /* 1536 x 768 — four 384 faces in a row, the bottom under the front.
         No cross: one display fills each face. */
      name:"CUBE 2", src:[1536, 768], W:384, H:384, D:384, rel:384 / 752.5,
      note:"384 × 384 per face, no seam",
      pieces:{
        A: { f:"left",   x:0, y:0, w:384, h:384, c:"#7B7BE8", k:"A", px:"384 × 384" },
        B: { f:"front",  x:0, y:0, w:384, h:384, c:"#5FD35F", k:"B", px:"384 × 384", front:true },
        C: { f:"right",  x:0, y:0, w:384, h:384, c:"#F5E640", k:"C", px:"384 × 384" },
        D: { f:"back",   x:0, y:0, w:384, h:384, c:"#E4493C", k:"D", px:"384 × 384" },
        E: { f:"bottom", x:0, y:0, w:384, h:384, c:"#F0A830", k:"E", px:"384 × 384" }
      },
      panels:[
        { p:"A", x:0, y:0, w:384, h:384, s:[   0,   0, 384, 384] },
        { p:"B", x:0, y:0, w:384, h:384, s:[ 384,   0, 384, 384] },
        { p:"C", x:0, y:0, w:384, h:384, s:[ 768,   0, 384, 384] },
        { p:"D", x:0, y:0, w:384, h:384, s:[1152,   0, 384, 384] },
        { p:"E", x:0, y:0, w:384, h:384, s:[ 384, 384, 384, 384] }
      ]
    },

    "3": {
      /* 672 x 480 — not a cube: F is 288 x 192, so the depth is 192.
         A box 288 W x 288 H x 192 D. The side faces are only part lit,
         in a staircase of four blocks each. */
      name:"CUBE 3", src:[672, 480], W:288, H:288, D:192, rel:288 / 752.5,
      note:"288 × 288 × 192 box — side faces part lit",
      pieces:{
        D: { f:"left",   x:0,  y:0,   w:192, h:288, c:"#5FD35F", k:"D", px:"stepped" },
        A: { f:"front",  x:0,  y:0,   w:288, h:288, c:"#F5E13D", k:"A", px:"288 × 288", front:true },
        B: { f:"right",  x:0,  y:0,   w:192, h:288, c:"#E4493C", k:"B", px:"stepped" },
        F: { f:"bottom", x:0,  y:0,   w:288, h:192, c:"#D94FD9", k:"F", px:"288 × 192" }
      },
      panels:[
        { p:"D", x:64, y:0,   w:128, h:96, s:[  0,   0, 128, 96] },
        { p:"D", x:96, y:96,  w:96,  h:96, s:[  0,  96,  96, 96] },
        { p:"D", x:96, y:192, w:96,  h:96, s:[  0, 192,  96, 96] },
        { p:"D", x:0,  y:224, w:96,  h:64, s:[  0, 224,  96, 64] },
        { p:"A", x:0,  y:0,   w:288, h:288, s:[192,   0, 288, 288] },
        { p:"B", x:0,  y:0,   w:128, h:96, s:[480,   0, 128, 96] },
        { p:"B", x:0,  y:96,  w:96,  h:96, s:[480,  96,  96, 96] },
        { p:"B", x:0,  y:192, w:96,  h:96, s:[480, 192,  96, 96] },
        { p:"B", x:96, y:224, w:96,  h:64, s:[576, 224,  96, 64] },
        { p:"F", x:0,  y:0,   w:288, h:192, s:[192, 288, 288, 192] }
      ]
    }
  };

  /* face size and placement for a W x H x D box, all in screen px */
  const FACE_OF = {
    front:  (w, h, d) => [w, h, `translateZ(${d / 2}px)`],
    back:   (w, h, d) => [w, h, `rotateY(180deg) translateZ(${d / 2}px)`],
    right:  (w, h, d) => [d, h, `rotateY(90deg) translateZ(${w / 2}px)`],
    left:   (w, h, d) => [d, h, `rotateY(-90deg) translateZ(${w / 2}px)`],
    bottom: (w, h, d) => [w, d, `rotateX(-90deg) translateZ(${h / 2}px)`],
    top:    (w, h, d) => [w, d, `rotateX(90deg) translateZ(${h / 2}px)`]
  };
  /* Where the three actually hang, in one 3D space. Each box keeps its true
     size — same pixel pitch across the three, so the edge follows the pixel
     count — and the camera does the rest: the far ones are not drawn smaller,
     they are further away. Solved so the projection reproduces the render,
     which also lands cube 3 dead frontal and swings cube 2 round to 24 deg,
     exactly as the visual shows. Units are cube 1's edge. */
  const CAM = 9.69;                                    // camera distance
  const ALL = {
    "3": { size:288 / 752.5, x:-1.4330, y:-0.4411, z:2.9593 },
    "1": { size:1,           x: 0,      y: 0,      z:0      },
    "2": { size:384 / 752.5, x: 1.5696, y:-0.3756, z:2.1865 }
  };
  const ORDER = ["3", "1", "2"];
  /* the stage is sized symmetrically about cube 1 so the vanishing point lands
     on it; LIFT then drops the whole stage, camera and all, to sit the group
     in the middle of the window */
  const SPAN = 5.00, RISE = 2.00, LIFT = 0.205;
  const BLENDS = ["source-over", "screen", "multiply", "overlay", "lighter", "difference"];

  /* per-rig state: its own canvases, its own composite buffer */
  Object.keys(RIGS).forEach(id => {
    const R = RIGS[id];
    R.canvases = [{ layers: [] }];
    R.cur = 0;
    R.off = document.createElement("canvas");
    R.off.width  = Math.round(R.src[0] / 2);
    R.off.height = Math.round(R.src[1] / 2);
    R.octx = R.off.getContext("2d");
  });

  /* matched to the render: the left face reads 0.212 of the front face across,
     the bottom 0.111 of it down — atan of those is 12 deg round and 6 deg up */
  const V = { mode:"1", tilt:6, spin:12, size:620 };
  let sel = -1, live = [], t0 = performance.now();
  const layersOf = R => R.canvases[R.cur].layers;
  const lit = R => layersOf(R).some(L => L.ready && L.visible);
  const CUR = () => RIGS[V.mode];

  /* ---------- build ---------- */
  function rig(R, px, shared){
    const scene = el("scene"), cube = el("cube");
    const k = px / Math.max(R.W, R.H, R.D);
    const w = R.W * k, h = R.H * k, d = R.D * k;
    const spec = !lit(R), slots = [];
    const kf = Math.round(px * .155), pf = Math.round(px * .072), gap = px * .105;
    if (!shared) scene.style.perspective = Math.round(px * 16) + "px";
    scene.style.width = w + "px"; scene.style.height = h + "px";
    cube.style.cssText = `width:${w}px;height:${h}px;` +
      `transform:rotateX(${V.tilt}deg) rotateY(${V.spin}deg);`;

    Object.keys(FACE_OF).forEach(key => {
      const [fw, fh, t] = FACE_OF[key](w, h, d);
      const face = el("cf", `width:${fw}px;height:${fh}px;` +
                            `left:${(w - fw) / 2}px;top:${(h - fh) / 2}px;transform:${t};`);
      R.panels.filter(p => R.pieces[p.p].f === key).forEach(p => {
        const q = R.pieces[p.p];
        // the plate is never wider than the narrowest display of its piece, so
        // the same type lands identically in each panel the piece spans
        const narrow = Math.min.apply(null, R.panels.filter(z => z.p === p.p).map(z => z.w));
        const box = el("pnl", `left:${p.x * k}px;top:${p.y * k}px;` +
                              `width:${p.w * k}px;height:${p.h * k}px;` +
                              (spec ? `background:${q.c};` : ""));
        if (spec){
          const Wt = Math.min(q.w, narrow) * k;
          const cx = (q.x + q.w / 2 - p.x) * k, cy = (q.y + q.h / 2 - p.y) * k;
          const fit = Math.min(pf, Math.floor((Wt - 12) / (q.px.length * .58)));
          const pl = el("plate", `left:${cx - Wt / 2}px;top:${cy}px;width:${Wt}px;height:0;`);
          pl.innerHTML =
            `<span class="k" style="font-size:${kf}px;bottom:${gap / 2}px">${q.k}</span>` +
            `<span class="px" style="font-size:${fit}px;top:${gap / 2}px">${q.px}</span>` +
            (q.front ? `<span class="fr" style="font-size:${Math.round(fit * .92)}px;` +
                       `top:${gap / 2 + fit * 1.6}px">Front</span>` : "");
          box.appendChild(pl);
        } else {
          const cv = document.createElement("canvas");
          cv.width  = clamp(Math.round(p.w * k * 1.5), 90, 480);
          cv.height = clamp(Math.round(p.h * k * 1.5), 90, 480);
          box.appendChild(cv);
          slots.push({ cv, ctx: cv.getContext("2d"), s: p.s });
        }
        face.appendChild(box);
      });
      cube.appendChild(face);
    });
    scene.appendChild(cube);
    return { R, scene, cube, slots, k, w, h, d };
  }

  function render(){
    stage.innerHTML = ""; live = [];
    const all = V.mode === "all";
    if (all){
      // one camera over the whole space; the eye sits above cube 1, so cube 1
      // keeps the base angle and the other two are seen from where they hang
      // fit the whole group to the window, then let the wheel zoom from there
      const fit = Math.min(room.clientWidth * .94 / SPAN, room.clientHeight * .86 / RISE);
      const S1 = fit * (V.size / 620);
      stage.style.cssText = `position:relative;width:${SPAN * S1}px;height:${RISE * S1}px;` +
                            `top:${LIFT * S1}px;flex:0 0 auto;` +
                            `perspective:${Math.round(CAM * S1)}px;perspective-origin:50% 50%;`;
      const world = el("", "position:absolute;left:50%;top:50%;width:0;height:0;" +
                           "transform-style:preserve-3d;");
      ORDER.forEach(id => {
        const L = ALL[id], g = rig(RIGS[id], S1 * L.size, true);
        g.scene.style.cssText += `position:absolute;left:${-g.w / 2}px;top:${-g.h / 2}px;` +
          `transform:translate3d(${L.x * S1}px,${L.y * S1}px,${L.z * S1}px);` +
          "transform-style:preserve-3d;";
        world.appendChild(g.scene); live.push(g);
      });
      stage.appendChild(world);
    } else {
      stage.style.cssText = "";
      const g = rig(CUR(), V.size);
      stage.appendChild(g.scene); live.push(g);
    }
    $("bar").style.display = all ? "none" : "flex";
    if (all){ setPanel.classList.remove("on"); $("gear").classList.remove("on"); }
    [...$("pickbar").children].forEach(b => b.classList.toggle("on", b.dataset.m === V.mode));
    tabs(); paint(true);
  }
  const turn = () => live.forEach(g => {
    g.cube.style.transform = `rotateX(${V.tilt}deg) rotateY(${V.spin}deg)`;
  });

  /* ---------- compositing: every layer into one frame, then onto the panels ---------- */
  function composite(R){
    const c = R.octx, OW = R.off.width, OH = R.off.height;
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    c.fillStyle = "#000"; c.fillRect(0, 0, OW, OH);
    layersOf(R).forEach(L => {
      if (!L.ready || !L.visible) return;
      c.globalAlpha = L.opacity;
      c.globalCompositeOperation = L.blend;
      if (L.kind === "color"){ c.fillStyle = L.color; c.fillRect(0, 0, OW, OH); return; }
      const n = L.node;
      if (L.kind === "video" && n.readyState < 2) return;
      const vw = L.kind === "video" ? n.videoWidth : n.naturalWidth;
      const vh = L.kind === "video" ? n.videoHeight : n.naturalHeight;
      if (!vw || !vh) return;
      let dw, dh;
      if (L.fit === "stretch"){ dw = OW * L.scale; dh = OH * L.scale; }
      else {
        const sc = (L.fit === "cover" ? Math.max(OW / vw, OH / vh) : Math.min(OW / vw, OH / vh)) * L.scale;
        dw = vw * sc; dh = vh * sc;
      }
      c.drawImage(n, (OW - dw) / 2 + L.dx * OW / R.src[0], (OH - dh) / 2 + L.dy * OH / R.src[1], dw, dh);
    });
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
  }
  function paint(force){
    live.forEach(g => {
      const R = g.R;
      if (!lit(R) || !g.slots.length) return;
      const moving = layersOf(R).some(L => L.ready && L.visible && L.kind === "video");
      if (!moving && !force) return;
      composite(R);
      const ax = R.off.width / R.src[0], ay = R.off.height / R.src[1];
      g.slots.forEach(o => {
        const [sx, sy, sw, sh] = o.s;
        o.ctx.drawImage(R.off, sx * ax, sy * ay, sw * ax, sh * ay, 0, 0, o.cv.width, o.cv.height);
      });
    });
  }
  (function tick(){ paint(false); requestAnimationFrame(tick); })();

  /* every clip runs off one clock, so layers and canvases stay in step */
  setInterval(() => {
    const now = performance.now();
    Object.keys(RIGS).forEach(id => RIGS[id].canvases.forEach(C => C.layers.forEach(L => {
      if (L.kind !== "video" || !L.ready) return;
      const D = L.node.duration;
      if (!D || !isFinite(D)) return;
      const target = ((((now - t0) / 1000 * L.rate + L.start) % D) + D) % D;
      let err = target - L.node.currentTime;
      if (err > D / 2) err -= D; else if (err < -D / 2) err += D;
      if (Math.abs(err) > .35){ L.node.currentTime = target; L.node.playbackRate = L.rate; }
      else L.node.playbackRate = clamp(L.rate * (1 + err * .6), .1, 4);
    })));
  }, 400);

  /* ---------- layers ---------- */
  function addColor(){
    layersOf(CUR()).push({ kind:"color", color:"#101010", node:null, url:null, name:"Color",
                           ready:true, visible:true, opacity:1, blend:"source-over" });
    sel = layersOf(CUR()).length - 1;
    render(); drawer();
  }
  function addFiles(files){
    if (V.mode === "all") return;
    const R = CUR();
    [...files].forEach(f => {
      const url = URL.createObjectURL(f);
      // some .mov files arrive with an empty type, so fall back to the name
      const vid = f.type.startsWith("video") || /\.(mov|mp4|m4v|webm|mkv|avi|qt)$/i.test(f.name);
      const L = { kind: vid ? "video" : "image", node:null, url, name:f.name, ready:false,
                  visible:true, opacity:1, blend:"source-over", fit:"cover",
                  scale:1, dx:0, dy:0, rate:1, start:0 };
      layersOf(R).push(L);
      if (L.kind === "video"){
        const v = document.createElement("video");
        Object.assign(v, { src:url, muted:true, loop:true, autoplay:true, playsInline:true });
        v.setAttribute("playsinline", ""); v.style.display = "none";
        document.body.appendChild(v);
        v.addEventListener("loadeddata", () => { L.node = v; L.ready = true; render(); drawer(); v.play().catch(() => {}); });
        v.addEventListener("error", () => { L.bad = true; drawer(); });
      } else {
        const im = new Image();
        im.onload = () => { L.node = im; L.ready = true; render(); drawer(); };
        im.src = url;
      }
    });
    drawer();
  }
  function freeLayer(L){
    if (L.kind === "video" && L.node){ L.node.pause(); L.node.remove(); }
    if (L.url) URL.revokeObjectURL(L.url);
  }
  function dropLayer(i){
    const a = layersOf(CUR());
    freeLayer(a[i]); a.splice(i, 1);
    if (sel >= a.length) sel = a.length - 1;
    render(); drawer();
  }
  function move(i, d){
    const a = layersOf(CUR()), j = i + d;
    if (j < 0 || j >= a.length) return;
    a.splice(j, 0, a.splice(i, 1)[0]);
    sel = j; render(); drawer();
  }

  /* ---------- panel ---------- */
  function slider(host, L, key, label, min, max, step, fmt){
    const r = el("r");
    const l = document.createElement("label"); l.textContent = label; r.appendChild(l);
    const i = document.createElement("input");
    i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = L[key];
    const v = el("v"); v.textContent = fmt ? fmt(L[key]) : L[key];
    i.addEventListener("input", () => {
      L[key] = parseFloat(i.value);
      v.textContent = fmt ? fmt(L[key]) : L[key];
      if (key === "start" && L.kind === "video" && L.node){
        const D = L.node.duration || 1;
        L.node.currentTime = ((((performance.now() - t0) / 1000 * L.rate + L.start) % D) + D) % D;
      }
      paint(true);
    });
    r.appendChild(i); r.appendChild(v); host.appendChild(r);
  }
  function picker(host, L, key, label, opts, labels){
    const r = el("r");
    const l = document.createElement("label"); l.textContent = label; r.appendChild(l);
    const s = document.createElement("select");
    opts.forEach((o, n) => { const e2 = document.createElement("option");
      e2.value = o; e2.textContent = labels ? labels[n] : o; s.appendChild(e2); });
    s.value = L[key];
    s.addEventListener("change", () => { L[key] = s.value; paint(true); });
    r.appendChild(s); host.appendChild(r);
  }
  function drawer(){
    if (V.mode === "all") return;
    const R = CUR(), a = layersOf(R);
    tabs();
    setPanel.innerHTML = "";
    const h = document.createElement("h4");
    h.textContent = `LAYERS · ${R.name} · CANVAS ${R.cur + 1}`;
    setPanel.appendChild(h);
    if (!a.length){
      const e2 = el("empty");
      e2.textContent = `${R.src[0]} × ${R.src[1]} delivery file. ${R.note}. ` +
                       "Add an image, a video or a colour — stack more on top and reorder them.";
      setPanel.appendChild(e2);
    }
    // topmost layer first, the way it reads on screen
    a.slice().reverse().forEach((L, ri) => {
      const i = a.length - 1 - ri;
      const box = el("lay" + (i === sel ? " sel" : ""));
      const hd = el("lhead");
      const eye = document.createElement("button");
      eye.className = "ic" + (L.visible ? "" : " off"); eye.textContent = L.visible ? "●" : "○";
      eye.addEventListener("click", () => { L.visible = !L.visible; render(); drawer(); });
      const nm = el("nm");
      nm.textContent = L.bad ? L.name + "  — codec not supported" : L.name;
      if (L.bad) nm.style.color = "#E4443B";
      nm.addEventListener("click", () => { sel = (sel === i ? -1 : i); drawer(); });
      const up = document.createElement("button"); up.className = "ic"; up.textContent = "↑";
      up.addEventListener("click", () => move(i, 1));
      const dn = document.createElement("button"); dn.className = "ic"; dn.textContent = "↓";
      dn.addEventListener("click", () => move(i, -1));
      const rm = document.createElement("button"); rm.className = "ic"; rm.textContent = "×";
      rm.addEventListener("click", () => dropLayer(i));
      [eye, nm, up, dn, rm].forEach(n => hd.appendChild(n));
      box.appendChild(hd);
      if (i === sel){
        if (L.kind === "color"){
          const r = el("r");
          const lb = document.createElement("label"); lb.textContent = "color"; r.appendChild(lb);
          const ci = document.createElement("input");
          ci.type = "color"; ci.value = L.color;
          ci.addEventListener("input", () => { L.color = ci.value; paint(true); });
          r.appendChild(ci); box.appendChild(r);
        }
        slider(box, L, "opacity", "opacity", 0, 1, .02, v => Math.round(v * 100) + "%");
        picker(box, L, "blend", "blend", BLENDS, ["normal", "screen", "multiply", "overlay", "add", "difference"]);
        if (L.kind !== "color"){
          picker(box, L, "fit", "fit", ["cover", "contain", "stretch"]);
          slider(box, L, "scale", "scale", .2, 3, .01, v => v.toFixed(2) + "×");
          slider(box, L, "dx", "shift x", -R.src[0] / 2, R.src[0] / 2, 4, v => v + "px");
          slider(box, L, "dy", "shift y", -R.src[1] / 2, R.src[1] / 2, 4, v => v + "px");
          if (L.kind === "video"){
            slider(box, L, "rate", "speed", .1, 3, .05, v => v.toFixed(2) + "×");
            const D = (L.node && L.node.duration) || 30;
            slider(box, L, "start", "start at", 0, +D.toFixed(2), .05, v => v.toFixed(2) + "s");
          }
        }
      }
      setPanel.appendChild(box);
    });
    const mk = (txt, ghost, fn) => {
      const b = document.createElement("button");
      b.className = "btn" + (ghost ? " ghost" : "");
      b.style.cssText = "width:100%;margin-top:6px";
      b.textContent = txt; b.addEventListener("click", fn);
      setPanel.appendChild(b);
    };
    mk("+ IMAGE / VIDEO", false, () => $("pick").click());
    mk("+ COLOR", false, addColor);
    mk("SYNC CLIPS", true, () => {
      t0 = performance.now();
      Object.keys(RIGS).forEach(id => RIGS[id].canvases.forEach(C => C.layers.forEach(L => {
        if (L.kind === "video" && L.ready){
          const D = L.node.duration || 1;
          L.node.currentTime = ((L.start % D) + D) % D;
          L.node.play().catch(() => {});
        }
      })));
    });
  }
  function tabs(){
    const t = $("tabs"); t.innerHTML = "";
    if (V.mode === "all") return;
    const R = CUR();
    R.canvases.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "tab" + (i === R.cur ? " on" : ""); b.textContent = i + 1;
      b.addEventListener("click", () => { R.cur = i; sel = -1; render(); drawer(); });
      t.appendChild(b);
    });
    const plus = document.createElement("button");
    plus.className = "tab"; plus.textContent = "+";
    plus.addEventListener("click", () => {
      R.canvases.push({ layers: [] }); R.cur = R.canvases.length - 1; sel = -1;
      setPanel.classList.add("on"); $("gear").classList.add("on");
      render(); drawer();
    });
    t.appendChild(plus);
  }

  /* ---------- mouse ---------- */
  let drag = null;
  room.addEventListener("pointerdown", e => {
    drag = { x:e.clientX, y:e.clientY, spin:V.spin, tilt:V.tilt };
    room.setPointerCapture(e.pointerId);
  });
  room.addEventListener("pointermove", e => {
    if (!drag) return;
    V.spin = drag.spin + (e.clientX - drag.x) * .35;
    V.tilt = clamp(drag.tilt - (e.clientY - drag.y) * .3, -85, 85);
    turn();
  });
  room.addEventListener("pointerup", () => { drag = null; });
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
  room.addEventListener("wheel", e => {
    e.preventDefault();
    V.size = clamp(V.size - e.deltaY * .6, 220, 1200);
    render();
  }, { passive:false });

  (function bar(){
    const host = $("pickbar");
    ["1", "2", "3", "all"].forEach(m => {
      const b = document.createElement("button");
      b.dataset.m = m; b.textContent = m === "all" ? "ALL" : "CUBE " + m;
      b.addEventListener("click", () => { V.mode = m; sel = -1; render(); drawer(); });
      host.appendChild(b);
    });
  })();
  $("add").addEventListener("click", () => $("pick").click());
  $("pick").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
  $("gear").addEventListener("click", () => {
    const on = setPanel.classList.toggle("on");
    $("gear").classList.toggle("on", on);
    if (on) drawer();
  });
  // clears the layers of the canvas you are on — other canvases and the view stay put
  $("reset").addEventListener("click", () => {
    const R = CUR();
    layersOf(R).forEach(freeLayer);
    R.canvases[R.cur].layers = []; sel = -1;
    render(); drawer();
  });
  ["dragenter", "dragover"].forEach(t =>
    room.addEventListener(t, e => { e.preventDefault(); room.classList.add("over"); }));
  room.addEventListener("dragleave", () => room.classList.remove("over"));
  room.addEventListener("drop", e => {
    e.preventDefault(); room.classList.remove("over"); addFiles(e.dataTransfer.files);
  });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => e.preventDefault());

  render();
})();
</script>
</body>
</html>
